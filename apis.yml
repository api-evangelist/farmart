name: FarMart
description: FarMart is an AI-powered food sourcing and procurement platform that connects
  suppliers, food manufacturers, processors, and logistics providers across the global food
  and energy supply chain. It provides end-to-end procurement infrastructure including verified
  supplier discovery, five-minute AI-powered KYC verification, compliance management, market-to-factory
  batch traceability, automated invoicing and e-way bill generation, and real-time payment settlement
  in one to four hours. FarMart serves food companies, HoReCa (hospitality) buyers, and bio-fuel supply
  chains, with a network spanning 100+ premium buyers, 50+ food categories, and 10,000+ suppliers.
